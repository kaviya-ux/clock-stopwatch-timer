<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock / Stopwatch / Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 3 in 1 project - clock, stopwatch and a countdown timer, switching between them with tabs -->
  <div class="app">

    <div class="tabs">
      <button class="tab-btn active" data-tab="clock">Clock</button>
      <button class="tab-btn" data-tab="stopwatch">Stopwatch</button>
      <button class="tab-btn" data-tab="timer">Timer</button>
    </div>

    <!-- clock tab -->
    <section class="tab-content active" id="clock">
      <div class="time-display" id="clock-time">00:00:00</div>
      <div class="date-display" id="clock-date"></div>
    </section>

    <!-- stopwatch tab -->
    <section class="tab-content" id="stopwatch">
      <div class="time-display" id="stopwatch-time">00:00:00</div>
      <div class="controls">
        <button class="btn start" id="stopwatch-start">Start</button>
        <button class="btn lap" id="stopwatch-lap">Lap</button>
        <button class="btn reset" id="stopwatch-reset">Reset</button>
      </div>
      <ul class="laps" id="stopwatch-laps"></ul>
    </section>

    <!-- timer tab -->
    <section class="tab-content" id="timer">
      <div class="time-display" id="timer-time">00:00:00</div>

      <!-- only shows when the timer isn't running yet -->
      <div class="timer-inputs" id="timer-inputs">
        <input type="number" id="timer-hours" min="0" max="23" placeholder="HH">
        <span>:</span>
        <input type="number" id="timer-minutes" min="0" max="59" placeholder="MM">
        <span>:</span>
        <input type="number" id="timer-seconds" min="0" max="59" placeholder="SS">
      </div>

      <div class="controls">
        <button class="btn start" id="timer-start">Start</button>
        <button class="btn reset" id="timer-reset">Reset</button>
      </div>
      <p class="timer-message" id="timer-message"></p>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
